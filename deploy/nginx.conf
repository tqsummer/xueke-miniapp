# 证书放在 deploy/certs/ 下：api.iopenai.tech.pem 与 api.iopenai.tech.key
server {
    listen 80;
    server_name api.iopenai.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.iopenai.tech;

    ssl_certificate     /etc/nginx/certs/api.iopenai.tech.pem;
    ssl_certificate_key /etc/nginx/certs/api.iopenai.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    location / {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}

# 在服务器上的项目根目录执行：docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# deploy/.env 由你在服务器上创建（见 .env.example），不进仓库。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xueke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需要设置 POSTGRES_PASSWORD}
      POSTGRES_DB: xueke
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xueke"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://xueke:${POSTGRES_PASSWORD}@postgres:5432/xueke
      JWT_SECRET: ${JWT_SECRET:?需要设置 JWT_SECRET}
      WX_APPID: ${WX_APPID:?需要设置 WX_APPID}
      WX_SECRET: ${WX_SECRET:?需要设置 WX_SECRET}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  pgdata:
